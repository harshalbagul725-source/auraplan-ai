<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraPlan AI — The Next-Gen Intelligent Event Planning Studio</title>
  <meta name="description" content="Event-planning studio for weddings, milestone birthdays, and community festivals with budgets, timelines, vendor checklists, and local planning prompts." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-layout">
    <!-- Main Header -->
    <header class="app-header">
      <div class="header-top-row">
        <!-- Logo & Brand -->
        <div class="brand-wrap">
          <div class="brand-logo-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
          </div>
          <div class="brand-text">
            <h1>AuraPlan AI</h1>
            <p>The Next-Gen Intelligent Event Planning Studio</p>
          </div>
        </div>

        <!-- Global Event Selector -->
        <div class="event-switcher-bar">
          <select id="event-switcher-select" class="event-select" title="Switch active event or create a new one"></select>
          <button class="btn btn-outline btn-sm" id="btn-new-event-quick">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New Event
          </button>
        </div>

        <!-- Quick Controls -->
        <div class="header-quick-tools">
          <a href="https://github.com/harshalbagul725-source/auraplan-ai" target="_blank" rel="noopener" class="btn-icon" title="View Source on GitHub">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
          </a>
          <button class="btn-icon" id="btn-toggle-theme" title="Toggle Dark/Light Mode">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          <button class="btn-icon" id="btn-app-settings" title="Settings & AI Status">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </div>

      <!-- Event Strip Meta & Top KPIs -->
      <div class="header-event-strip">
        <div class="event-headline-block">
          <div class="event-badge-title-row">
            <span class="badge badge-accent" id="header-event-type">WEDDING</span>
            <h2 class="event-title-display font-headline" id="header-event-title">Elena & Marcus’s Botanical Glasshouse Wedding</h2>
          </div>
          <span class="event-meta-info" id="header-event-meta">2026-10-24 &bull; Napa Valley, CA &bull; 140 Guests</span>
        </div>

        <div class="header-kpis-row">
          <div class="kpi-pill">
            <span class="kpi-label">Countdown</span>
            <div id="countdown-display" class="countdown-display"></div>
          </div>
          <div class="kpi-pill">
            <span class="kpi-label">Budget Committed</span>
            <span class="kpi-value font-headline" id="kpi-budget-progress">$38,200 / $42,000 (91%)</span>
          </div>
          <div class="kpi-pill">
            <span class="kpi-label">Vendor Roster</span>
            <span class="kpi-value font-headline" id="kpi-vendors-count">5 of 5 confirmed</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Navigation Tabs Bar -->
    <nav class="nav-tabs-bar" role="tablist" aria-label="Event planning sections">
      <button id="tab-button-ai" class="nav-tab-item ai-tab-glow active" data-tab="ai" role="tab" aria-selected="true" aria-controls="tab-ai" tabindex="0">
        <span class="ai-sparkle">✨</span> AuraPlan AI Co-Pilot
      </button>
      <button id="tab-button-dashboard" class="nav-tab-item" data-tab="dashboard" role="tab" aria-selected="false" aria-controls="tab-dashboard" tabindex="-1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="5" rx="1"/><rect x="13" y="10" width="8" height="11" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/></svg>
        Dashboard
      </button>
      <button id="tab-button-budget" class="nav-tab-item" data-tab="budget" role="tab" aria-selected="false" aria-controls="tab-budget" tabindex="-1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
        Budget & Financial Engine
      </button>
      <button id="tab-button-timeline" class="nav-tab-item" data-tab="timeline" role="tab" aria-selected="false" aria-controls="tab-timeline" tabindex="-1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Timeline & Run-of-Show
      </button>
      <button id="tab-button-vendors" class="nav-tab-item" data-tab="vendors" role="tab" aria-selected="false" aria-controls="tab-vendors" tabindex="-1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Vendor Hub & Checklist
      </button>
      <button id="tab-button-ideas" class="nav-tab-item" data-tab="ideas" role="tab" aria-selected="false" aria-controls="tab-ideas" tabindex="-1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg>
        Ideas & Moodboard Studio
      </button>
      <button id="tab-button-itinerary" class="nav-tab-item" data-tab="itinerary" role="tab" aria-selected="false" aria-controls="tab-itinerary" tabindex="-1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Master Itinerary & Print
      </button>
      <button id="tab-button-planner" class="nav-tab-item" data-tab="planner" role="tab" aria-selected="false" aria-controls="tab-planner" tabindex="-1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="m9 9 2 2 4-4"/></svg>
        Event Plan
      </button>
      <button id="tab-button-guests" class="nav-tab-item" data-tab="guests" role="tab" aria-selected="false" aria-controls="tab-guests" tabindex="-1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Guests & RSVPs
      </button>
      <button id="tab-button-invitation" class="nav-tab-item" data-tab="invitation" role="tab" aria-selected="false" aria-controls="tab-invitation" tabindex="-1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        Invitation Designer
      </button>
    </nav>

    <!-- Main Content Panes -->
    <main class="app-main-content">
      <section class="tab-pane" id="tab-dashboard" role="tabpanel" aria-labelledby="tab-button-dashboard" tabindex="0">
        <div id="dashboard-tab-content"></div>
      </section>

      <!-- 1. AI Co-Pilot Tab -->
      <section class="tab-pane active" id="tab-ai" role="tabpanel" aria-labelledby="tab-button-ai" tabindex="0">
        <div id="ai-tab-content"></div>
      </section>

      <!-- 2. Budget Tab -->
      <section class="tab-pane" id="tab-budget" role="tabpanel" aria-labelledby="tab-button-budget" tabindex="0">
        <div id="budget-tab-content"></div>
      </section>

      <!-- 3. Timeline Tab -->
      <section class="tab-pane" id="tab-timeline" role="tabpanel" aria-labelledby="tab-button-timeline" tabindex="0">
        <div id="timeline-tab-content"></div>
      </section>

      <!-- 4. Vendors Tab -->
      <section class="tab-pane" id="tab-vendors" role="tabpanel" aria-labelledby="tab-button-vendors" tabindex="0">
        <div id="vendors-tab-content"></div>
      </section>

      <!-- 5. Ideas Tab -->
      <section class="tab-pane" id="tab-ideas" role="tabpanel" aria-labelledby="tab-button-ideas" tabindex="0">
        <div id="ideas-tab-content"></div>
      </section>

      <!-- 6. Master Itinerary Tab -->
      <section class="tab-pane" id="tab-itinerary" role="tabpanel" aria-labelledby="tab-button-itinerary" tabindex="0">
        <div id="itinerary-tab-content"></div>
      </section>

      <section class="tab-pane" id="tab-planner" role="tabpanel" aria-labelledby="tab-button-planner" tabindex="0">
        <div id="planner-tab-content"></div>
      </section>

      <section class="tab-pane" id="tab-guests" role="tabpanel" aria-labelledby="tab-button-guests" tabindex="0">
        <div id="guests-tab-content"></div>
      </section>

      <section class="tab-pane" id="tab-invitation" role="tabpanel" aria-labelledby="tab-button-invitation" tabindex="0">
        <div id="invitation-tab-content"></div>
      </section>
    </main>
  </div>

  <!-- Global Modal Overlay -->
  <div class="modal-overlay" id="global-modal-overlay">
    <div id="global-modal-container"></div>
  </div>

  <!-- Global Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Application Logic Modules -->
  <script src="js/data.js"></script>
  <script src="js/planning-core.js"></script>
  <script src="js/ai-engine.js"></script>
  <script src="js/budget.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/vendors.js"></script>
  <script src="js/ideas.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/guests.js"></script>
  <script src="js/invitation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
